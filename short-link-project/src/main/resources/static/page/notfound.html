<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>短链不存在</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f6f8;
            color: #1f2329;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                         "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        }
        .box { text-align: center; padding: 48px 40px; }
        .code { font-size: 96px; font-weight: 700; letter-spacing: 4px; color: #3370ff; }
        .title { margin-top: 12px; font-size: 22px; font-weight: 600; }
        .desc { margin-top: 12px; font-size: 14px; line-height: 1.8; color: #646a73; }
        .tip { margin-top: 28px; font-size: 13px; color: #8f959e; }
    </style>
</head>
<body>
<div class="box">
    <div class="code">404</div>
    <div class="title">短链不存在或已失效</div>
    <div class="desc">
        该短链可能已被删除、已过期，或者从未存在过。<br>
        请检查链接是否输入正确。
    </div>
    <div class="tip">Short Link Service</div>
</div>
</body>
</html>
